# Brahmakaal — Docker Compose for Coolify
# Set all secrets via Coolify Environment Variables (not in this file)

services:
  brahmakaal-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    environment:
      - PORT=8888
      - ENVIRONMENT=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_ENABLED=true
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CORS_ORIGINS=*
      - LOG_LEVEL=INFO
      - EPHEMERIS_FILE_PATH=de421.bsp
    volumes:
      - ./data:/app/data
    restart: unless-stopped
