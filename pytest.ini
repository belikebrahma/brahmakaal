[pytest]
testpaths = tests
python_files = test_*.py
asyncio_mode = auto
markers =
    integration: end-to-end tests that call a running API server
    accuracy: astronomical/reference validation tests
    performance: response-time benchmark tests
    slow: long-running tests
filterwarnings =
    ignore:Support for class-based `config` is deprecated:DeprecationWarning
    ignore:Pydantic V1 style `@validator` validators are deprecated:DeprecationWarning
    ignore:Using extra keyword arguments on `Field` is deprecated:DeprecationWarning
