version: v1
services:
  - name: brahmakaal-api
    type: web-app
    language: python
    buildpack: docker
    dockerfile: Dockerfile
    port: 8000
    healthCheck:
      endpoint: /v1/health
      timeoutSeconds: 30
    env:
      - name: ENVIRONMENT
        value: production
      - name: PORT
        value: "8000"
      - name: JWT_SECRET_KEY
        value: "changeme-in-dashboard"
      - name: DATABASE_URL
        value: "changeme-in-dashboard"
      - name: REDIS_ENABLED
        value: "true"
      - name: REDIS_URL
        value: "changeme-in-dashboard"
      - name: EPHEMERIS_FILE_PATH
        value: "de421.bsp"
      - name: CORS_ORIGINS
        value: "*"
    resources:
      cpu: 500m
      memory: 1Gi
    scaling:
      minReplicas: 1
      maxReplicas: 3
