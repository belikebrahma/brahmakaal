{
  "services": [
    {
      "type": "web",
      "name": "brahmakaal-api",
      "env": "python",
      "plan": "free",
      "buildCommand": "pip install -r requirements.txt",
      "startCommand": "python start_api.py",
      "envVars": [
        { "key": "PORT", "value": "8000" },
        { "key": "ENVIRONMENT", "value": "production" },
        { "key": "JWT_SECRET_KEY", "value": "changeme-in-dashboard" },
        { "key": "DATABASE_URL", "value": "changeme-in-dashboard" },
        { "key": "REDIS_ENABLED", "value": "true" },
        { "key": "REDIS_URL", "value": "changeme-in-dashboard" },
        { "key": "EPHEMERIS_FILE_PATH", "value": "de421.bsp" },
        { "key": "CORS_ORIGINS", "value": "*" },
        { "key": "LOG_LEVEL", "value": "INFO" }
      ]
    }
  ]
}
